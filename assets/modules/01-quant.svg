<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="01 QUANT.ENGINE — Markets at the latency edge. High-frequency microstructure — queue position, order-book imbalance, adverse selection — turned into engines that price, size and fire without a human in the loop. Derivatives and risk underneath."><title>01 QUANT.ENGINE — Markets at the latency edge. High-frequency microstructure — queue position, order-book imbalance, adverse selection — turned into engines that price, size and fire without a human in the loop. Derivatives and risk underneath.</title><style>@font-face{font-family:'AHD';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AHM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AHMB';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'AHD','Unbounded','Arial Black',sans-serif;font-weight:800}
.m{font-family:'AHM','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:400}
.mb{font-family:'AHMB','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}

@keyframes breathe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.62)}}
@keyframes spin{to{transform:rotate(360deg)}}
.found{animation:found 4s steps(1) infinite}.closed{animation:closed 4s steps(1) infinite}
@keyframes found{0%,45%{opacity:0}46%,79%{opacity:1}80%,100%{opacity:0}}
@keyframes closed{0%,79%{opacity:0}80%,100%{opacity:1}}
.flow{animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-200}}
.beat{animation:beat 2.6s linear infinite}@keyframes beat{from{stroke-dashoffset:360}to{stroke-dashoffset:0}}

ch</text><rect x="323.0" y="260" width="69.0" height="30" rx="3" fill="#ff4054" fill-opacity=".06" stroke="#ff4054" stroke-opacity=".35"/><text class="m" x="335.0" y="280.4" font-size="15" fill="#e8ecef" fill-opacity=".85">OWASP</text><rect x="402.0" y="260" width="159.0" height="30" rx="3" fill="#ff4054" fill-opacity=".06" stroke="#ff4054" stroke-opacity=".35"/><text class="m" x="414.0" y="280.4" font-size="15" fill="#e8ecef" fill-opacity=".85">Threat Modeling</text><rect x="571.0" y="260" width="105.0" height="30" rx="3" fill="#ff4054" fill-opacity=".06" stroke="#ff4054" stroke-opacity=".35"/><text class="m" x="583.0" y="280.4" font-size="15" fill="#e8ecef" fill-opacity=".85">Hardening</text><line x1="790" y1="40" x2="790" y2="290" stroke="rgba(232,236,239,0.08)"/><defs><linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#ff4054" stop-opacity="0"/><stop offset="1" stop-color="#ff4054" stop-opacity=".35"/></linearGradient></defs><circle cx="990" cy="160" r="40" fill="none" stroke="#ff4054" stroke-opacity=".22"/><circle cx="990" cy="160" r="75" fill="none" stroke="#ff4054" stroke-opacity=".22"/><circle cx="990" cy="160" r="110" fill="none" stroke="#ff4054" stroke-opacity=".22"/><line x1="872" y1="160" x2="1108" y2="160" stroke="#ff4054" stroke-opacity=".15"/><line x1="990" y1="42" x2="990" y2="278" stroke="#ff4054" stroke-opacity=".15"/><g style="transform-origin:990px 160px;animation:spin 4s linear infinite"><path d="M990 160L1100 160A110 110 0 0 0 1074.3 89.3Z" fill="url(#sweep)"/></g><g class="found"><circle cx="1042" cy="114" r="6" fill="#ff4054"/><circle cx="1042" cy="114" r="14" fill="none" stroke="#ff4054" stroke-opacity=".6"/></g><g class="closed"><rect x="1031" y="103" width="22" height="22" fill="#05070a" stroke="#e8ecef" stroke-width="1.5"/><path d="M1036 114l4 4 8-8" fill="none" stroke="#e8ecef" stroke-width="2"/></g><text class="m" x="990" y="302" font-size="15" fill="#58626b" text-anchor="middle">FOUND → CLOSED</text></svg>
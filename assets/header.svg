ter-spacing="3.2">SYSTEMS ENGINEER &amp; TECHNICAL FOUNDER</text><g class="desc"><text class="m" x="48" y="424" font-size="17" fill="#949ea8" >I build systems that have to survive contact with the</text><text class="m" x="48" y="451" font-size="17" fill="#949ea8" >real world — live markets, open chains, hostile networks.</text></g><rect x="770" y="150" width="382" height="290" rx="8" fill="#080b10" stroke="rgba(232,236,239,0.08)"/><line x1="770" y1="186" x2="1152" y2="186" stroke="rgba(232,236,239,0.08)"/><circle cx="790" cy="168" r="4.5" fill="#ff4054" fill-opacity=".7"/><circle cx="806" cy="168" r="4.5" fill="#ffb224" fill-opacity=".7"/><circle cx="822" cy="168" r="4.5" fill="#00e08a" fill-opacity=".7"/><text class="m" x="1136" y="173" font-size="15" fill="#58626b" text-anchor="end">tty0</text><text class="m boot" style="animation-delay:0.35s" x="790" y="222" font-size="16" fill="#e8ecef">$ ah.sys --boot --user a0x0h</text><text class="m boot" style="animation-delay:0.67s" x="790" y="253" font-size="16" fill="#949ea8">[ <tspan class="mb" fill="#00e08a">OK</tspan> ] quant.engine<tspan fill="#58626b">....</tspan><tspan fill="#58626b"> loaded</tspan></text><text class="m boot" style="animation-delay:0.99s" x="790" y="284" font-size="16" fill="#949ea8">[ <tspan class="mb" fill="#3fc4ff">OK</tspan> ] chain.scan<tspan fill="#58626b">......</tspan><tspan fill="#58626b"> loaded</tspan></text><text class="m boot" style="animation-delay:1.31s" x="790" y="315" font-size="16" fill="#949ea8">[ <tspan class="mb" fill="#ff4054">OK</tspan> ] sec.kernel<tspan fill="#58626b">......</tspan><tspan fill="#58626b"> loaded</tspan></text><text class="m boot" style="animation-delay:1.63s" x="790" y="346" font-size="16" fill="#949ea8">[ <tspan class="mb" fill="#9e7bff">OK</tspan> ] agent.mesh<tspan fill="#58626b">......</tspan><tspan fill="#58626b"> loaded</tspan></text><text class="m boot" style="animation-delay:1.95s" x="790" y="377" font-size="16" fill="#949ea8">[ <tspan class="mb" fill="#ffb224">OK</tspan> ] infra.base<tspan fill="#58626b">......</tspan><tspan fill="#58626b"> loaded</tspan></text><text class="mb boot" style="animation-delay:2.27s" x="790" y="412" font-size="16" fill="#00e08a">» all modules nominal</text><rect class="boot" style="animation-delay:2.27s" x="998" y="397" width="10" height="19" fill="#00e08a"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Abolfazl Hosseini — Systems Engineer &amp; Technical Founder. Booting modules: quant, chain, sec, agent, infra."><title>Abolfazl Hosseini — Systems Engineer &amp; Technical Founder. Booting modules: quant, chain, sec, agent, infra.</title><style>@font-face{font-family:'AHD';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AHM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AHMB';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'AHD','Unbounded','Arial Black',sans-serif;font-weight:800}
.m{font-family:'AHM','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:400}
.mb{font-family:'AHMB','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}

.boot{opacity:0;animation:fadein .25s ease forwards}
.name{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
.role{animation:fadein 1s .5s ease both}
.desc{animation:fadein 1s .8s ease both}
